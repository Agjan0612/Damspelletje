<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dammie – regeltests</title>
  <style>
    :root { --ok: #1a7f37; --fout: #c62828; --tekst: #1f2328; --zacht: #59636e; --bg: #fff; --kaart: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ok: #3fb950; --fout: #ff6b6b; --tekst: #e6edf3; --zacht: #9198a1; --bg: #0d1117; --kaart: #161b22; }
    }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--tekst); }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .samenvatting { font-size: 1.25rem; font-weight: 600; padding: 12px 16px; border-radius: 10px; background: var(--kaart); margin: 16px 0; }
    .samenvatting.ok { color: var(--ok); }
    .samenvatting.fout { color: var(--fout); }
    h2 { font-size: 1rem; margin: 20px 0 6px; color: var(--zacht); text-transform: uppercase; letter-spacing: .04em; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 4px 0; }
    li.ok::before { content: "✔ "; color: var(--ok); }
    li.fout::before { content: "✘ "; color: var(--fout); }
    li.fout { color: var(--fout); }
    .melding { font-size: .9rem; color: var(--zacht); margin-left: 1.4em; white-space: pre-wrap; }
    .info { color: var(--zacht); font-size: .9rem; }
    button { font: inherit; font-size: 1.1rem; padding: 10px 20px; border-radius: 10px; border: 0; background: #2f6feb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>Dammie – regeltests</h1>
  <p class="info">Controleert of de spelregels (FMJD) goed in de code zitten. Alles groen = de regels kloppen.</p>
  <button id="opnieuw" type="button">▶ Tests opnieuw draaien</button>
  <div id="samenvatting" class="samenvatting">Tests worden geladen…</div>
  <div id="resultaten"></div>
</main>

<script>
  // Als de pagina rechtstreeks als bestand is geopend (file://), mogen
  // browsers de JavaScript-modules niet laden. Leg dat dan uit.
  setTimeout(function () {
    var el = document.getElementById('samenvatting');
    if (el && el.textContent === 'Tests worden geladen…') {
      el.className = 'samenvatting fout';
      el.textContent = location.protocol === 'file:'
        ? 'De tests kunnen niet starten vanaf een los bestand. Open deze pagina via GitHub Pages, of zie README.md (kopje "Tests draaien").'
        : 'De tests konden niet worden geladen.';
    }
  }, 1500);
</script>
<script type="module">
  import { runAllTests } from './tests.js';

  function render() {
    const { results, info } = runAllTests();
    const failed = results.filter((r) => !r.ok);
    const sum = document.getElementById('samenvatting');
    sum.className = 'samenvatting ' + (failed.length ? 'fout' : 'ok');
    sum.textContent = failed.length
      ? `${failed.length} van ${results.length} tests mislukt`
      : `Alle ${results.length} tests geslaagd`;

    const out = document.getElementById('resultaten');
    out.replaceChildren();
    let ul = null;
    let group = null;
    for (const r of results) {
      if (r.group !== group) {
        group = r.group;
        const h = document.createElement('h2');
        h.textContent = group;
        ul = document.createElement('ul');
        out.append(h, ul);
      }
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'fout';
      li.textContent = r.name;
      if (!r.ok) {
        const m = document.createElement('div');
        m.className = 'melding';
        m.textContent = r.error;
        li.append(m);
      }
      ul.append(li);
    }
    if (info.length) {
      const h = document.createElement('h2');
      h.textContent = 'Ter info';
      const p = document.createElement('p');
      p.className = 'info';
      p.textContent = info.join(' · ');
      out.append(h, p);
    }
  }

  document.getElementById('opnieuw').addEventListener('click', render);
  render();
</script>
</body>
</html>
